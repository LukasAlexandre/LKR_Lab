name: Windows validation
on:
  push:
    branches: ['feat/**', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test -p hub-core
      - run: cargo clippy -p hub-core --all-targets -- -D warnings
      - run: cargo test -p hub-core live_port_detection_uses_read_only_socket -- --ignored
      - run: cargo check -p lk-dev-hub
      - run: npm run tauri build
