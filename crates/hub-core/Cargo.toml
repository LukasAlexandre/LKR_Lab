[package]
name = "hub-core"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.39.6"
netstat2 = "0.11"
wait-timeout = "0.2"
toml = "0.9"
sha2 = "0.10"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Services", "Win32_System_EventLog", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_SecurityCenter", "Win32_System_TpmBaseServices", "Win32_System_SystemInformation", "Win32_Globalization"] }
[dev-dependencies]
tempfile = "3"
