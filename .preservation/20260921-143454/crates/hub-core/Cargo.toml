[package]
name = "hub-core"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.39.6"
netstat2 = "0.11"
wait-timeout = "0.2"
[dev-dependencies]
tempfile = "3"
